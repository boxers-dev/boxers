name: Tests

# Validate every commit before it can be released. The npm publishing workflow
# requires a successful push run from this file for the exact tagged commit.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
